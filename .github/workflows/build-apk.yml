name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -Dorg.gradle.parallel=true -Dorg.gradle.caching=true -Dorg.gradle.daemon=false"

jobs:
  build:
    name: assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── 1. 检出代码（含 gradle wrapper + 本地 TFLite 模型） ──
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. JDK 17 ──
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ── 3. Android SDK ──
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools-version: 34.0.0

      # ── 4. 授权 gradlew 可执行 ──
      - name: Grant gradlew execute
        run: chmod +x gradlew

      # ── 5. Gradle 缓存 ──
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # ── 6. 编译（使用项目本地 gradlew，避开系统 Gradle） ──
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      # ── 7. 上传 APK 制品 ──
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: facecompare-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
          compression-level: 6

      # ── 8. 上传构建日志 ──
      - name: Upload build logs
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            app/build/outputs/logs/
            app/build/reports/
          retention-days: 7
        if: failure()
